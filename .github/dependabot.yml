# S08: dependency updates have an owner and a process.
#
# The dependency surface is deliberately small — one third-party Swift package plus the GitHub
# Actions used by CI and releases — so weekly is frequent enough to stay current without noise.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/ThreeMFKit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers: ["trsdn"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers: ["trsdn"]
