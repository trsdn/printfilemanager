# S08: dependency updates have an owner and a process.
#
# Swift packages are declared in XcodeGen's project.yml, not a Package.swift in this repository.
# The old /ThreeMFKit directory is now a separate repository. The maintainer reviews the app's
# package versions weekly using the exact-pin update process in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers: ["trsdn"]
