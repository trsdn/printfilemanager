name: Release

# R03: a tag produces installable artifacts through automation.
#
# Signing and notarization need credentials that are not in the repository, so the job is
# skipped unless they are configured as secrets. Without them the workflow still builds and
# publishes unsigned artifacts, clearly labelled as not distributable, rather than silently
# producing something that will not open on another Mac.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the current ref)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Verify the tag matches the marketing version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          plist=printfilemanager/Sources/PrintFileManagerApp/Info.plist
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match CFBundleShortVersionString $version in $plist"
            exit 1
          fi

      - name: Import signing certificate
        id: signing
        if: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PROFILE: notary
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "$TEAM_ID" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --keychain build.keychain
          scripts/release.sh

      - name: Build unsigned
        if: ${{ steps.signing.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          echo "::warning::No signing certificate configured. Building unsigned artifacts, which will not open on another Mac and cannot register Quick Look extensions."
          mkdir -p .release
          for pair in "printfilemanager PrintFileManager.xcodeproj PrintFileManager" \
                      "Quicklook ThreeMFQuickLook.xcodeproj ThreeMFQuickLook"; do
            set -- $pair
            (cd "$1" && xcodegen generate --quiet)
            xcodebuild archive -project "$1/$2" -scheme "$3" -configuration Release \
              -destination 'platform=macOS' -archivePath ".release/$3.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
            cp -R ".release/$3.xcarchive/Products/Applications/$3.app" .release/
            ditto -c -k --keepParent ".release/$3.app" ".release/$3-unsigned.zip"
          done

      # R05: prove the built artifact actually launches before publishing it.
      - name: Smoke-test the built app
        run: |
          set -euo pipefail
          app=.release/PrintFileManager.app
          [ -d "$app" ] || { echo "::error::no app was produced"; exit 1; }
          "$app/Contents/MacOS/PrintFileManager" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app exited within 10 seconds of launching"
            exit 1
          fi
          kill "$pid"
          echo "App launched and stayed running."

      - uses: softprops/action-gh-release@v2
        with:
          files: .release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
