name: Release

# R03: a tag produces installable artifacts through automation.
#
# Signing and notarization deliberately do NOT happen here. They run in
# trsdn/macos-notarization-broker, which builds from a pinned commit in a secretless job and
# signs in a gated environment, so Apple credentials never exist in this repository at all.
# This workflow produces the unsigned build, proves it launches, and publishes the release that
# the broker's signed artifacts are then attached to.
#
# After this workflow succeeds, run from the broker:
#   scripts/request.sh printfilemanager vX.Y
#   scripts/request.sh threemfquicklook vX.Y

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen

      - name: Derive the version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag like v1.2 or v1.2.3"
            exit 1
          fi
          echo "marketing=$tag" >> "$GITHUB_OUTPUT"
          # A monotonic build number, so two builds of the same marketing version are
          # distinguishable. Info.plist takes both from the build, never from a literal.
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $tag ($GITHUB_RUN_NUMBER)"

      - name: Build
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p .release
          build() {
            (cd "$1" && xcodegen generate --quiet)
            xcodebuild archive -project "$1/$2" -scheme "$3" -configuration Release \
              -destination 'platform=macOS' -archivePath ".release/$3.xcarchive" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
            cp -R ".release/$3.xcarchive/Products/Applications/$3.app" .release/
            ditto -c -k --keepParent ".release/$3.app" ".release/$3-v$MARKETING_VERSION-macOS-arm64-unsigned.zip"
          }
          build printfilemanager PrintFileManager.xcodeproj PrintFileManager
          build Quicklook ThreeMFQuickLook.xcodeproj ThreeMFQuickLook

      - name: Verify the artifact carries the tag version
        env:
          EXPECTED: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            .release/PrintFileManager.app/Contents/Info.plist)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Built artifact reports $actual but the tag says $EXPECTED"
            exit 1
          fi
          echo "Artifact reports $actual."

      # R05: prove the built artifact actually launches before publishing it.
      - name: Smoke-test the built app
        run: |
          set -euo pipefail
          .release/PrintFileManager.app/Contents/MacOS/PrintFileManager &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app exited within 10 seconds of launching"
            exit 1
          fi
          kill "$pid"
          echo "App launched and stayed running."

      - uses: softprops/action-gh-release@v3
        with:
          files: .release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            These artifacts are **unsigned** and will not open on another Mac.

            Signed and notarized builds are produced separately by
            [macos-notarization-broker](https://github.com/trsdn/macos-notarization-broker), so
            that Apple credentials never exist in this repository:

            ```
            scripts/request.sh printfilemanager ${{ github.ref_name }}
            scripts/request.sh threemfquicklook ${{ github.ref_name }}
            ```
