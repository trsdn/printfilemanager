name: Repository stats

# P09: the activity card is generated and committed rather than fetched from a third-party
# renderer at read time.
#
# The card cannot be pushed straight to `main`: the branch requires status checks that this
# workflow does not run, and the only ways around that are a token with bypass rights or relaxing
# the protection. Both trade a real guarantee for a picture. Instead this opens a pull request, so
# the card still refreshes itself and the protection stays exactly as strict.
#
# The pull request is reviewed and merged by the maintainer, not by this workflow. GitHub holds
# workflow runs for events created with GITHUB_TOKEN at `action_required` until someone approves
# them, so the required checks do run -- after one click -- rather than never. Dispatching CI at
# the branch instead was tried and does not help: the check runs attach to the head commit, but
# the pull request's own status rollup ignores them. Making this self-merging would need a
# personal access token, which is the trade this design exists to avoid.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: read

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  render:
    name: Render and propose
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: trsdn/.github
          path: stats-source

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r stats-source/requirements.txt

      - name: Render cards
        env:
          STATS_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/stats-source/scripts
        run: |
          python -m profile_stats repo \
            --repo "${{ github.repository }}" \
            --theme both \
            --out .github/stats

      - name: Open a pull request when the card changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/repository-stats
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/stats; then
            echo "No repository stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- .github/stats
          git commit -m "chore(stats): update repository stats"
          # Plain --force is correct here: this branch is owned entirely by this workflow, is
          # recreated from main every run, and is deleted on merge. --force-with-lease cannot be
          # used because a fresh checkout has no tracking ref to lease against, which is what
          # broke the first run after the branch was deleted.
          git push --force origin "$BRANCH"

          # Reuse the open pull request when there is one, so a weekly refresh does not pile up.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore(stats): update repository stats" \
              --body "Generated by the Repository stats workflow. The card is committed rather than fetched from a third-party renderer, so no external host observes readers of the README."
          fi
