name: ThreeMFQuickLook
options:
  bundleIdPrefix: com.printfilemanager
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  ThreeMFCore:
    type: framework
    platform: macOS
    sources:
      - Sources/ThreeMFCore
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFCore
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ThreeMFQuickLook:
    type: application
    platform: macOS
    sources:
      - Sources/ThreeMFQuickLookApp
    dependencies:
      - target: ThreeMFPreviewExtension
        embed: true
      - target: ThreeMFThumbnailExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook
        INFOPLIST_FILE: Sources/ThreeMFQuickLookApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFQuickLookApp/ThreeMFQuickLook.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ThreeMFPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/ThreeMFPreviewExtension
    dependencies:
      - target: ThreeMFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook.preview
        INFOPLIST_FILE: Sources/ThreeMFPreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFPreviewExtension/ThreeMFPreviewExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ThreeMFThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/ThreeMFThumbnailExtension
    dependencies:
      - target: ThreeMFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook.thumbnail
        INFOPLIST_FILE: Sources/ThreeMFThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFThumbnailExtension/ThreeMFThumbnailExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ThreeMFCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ThreeMFCoreTests
    dependencies:
      - target: ThreeMFCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFCoreTests

schemes:
  ThreeMFQuickLook:
    build:
      targets:
        ThreeMFQuickLook: all
        ThreeMFCoreTests: [test]
    test:
      targets:
        - ThreeMFCoreTests
