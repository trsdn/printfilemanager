name: ThreeMFQuickLook
options:
  bundleIdPrefix: com.printfilemanager
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Single source for the version, mirroring printfilemanager/project.yml. Both projects ship
    # in one release, so scripts/check-versions.sh enforces that these two values stay equal.
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "5"
packages:
  # Shared 3MF parsing and preview extraction, also consumed by the app project.
  # Its own tests live in the package and run with `swift test`.
  ThreeMFKit:
    path: ../ThreeMFKit
targets:
  ThreeMFQuickLook:
    type: application
    platform: macOS
    sources:
      - Sources/ThreeMFQuickLookApp
    dependencies:
      - target: ThreeMFPreviewExtension
        embed: true
      - target: ThreeMFThumbnailExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook
        INFOPLIST_FILE: Sources/ThreeMFQuickLookApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFQuickLookApp/ThreeMFQuickLook.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ThreeMFPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/ThreeMFPreviewExtension
    dependencies:
      - package: ThreeMFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook.preview
        INFOPLIST_FILE: Sources/ThreeMFPreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFPreviewExtension/ThreeMFPreviewExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ThreeMFThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/ThreeMFThumbnailExtension
    dependencies:
      - package: ThreeMFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.ThreeMFQuickLook.thumbnail
        INFOPLIST_FILE: Sources/ThreeMFThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThreeMFThumbnailExtension/ThreeMFThumbnailExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"

schemes:
  ThreeMFQuickLook:
    build:
      targets:
        ThreeMFQuickLook: all
