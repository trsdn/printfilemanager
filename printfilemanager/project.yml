name: PrintFileManager
options:
  bundleIdPrefix: com.printfilemanager
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Single source for the version. Info.plist references these rather than carrying literals,
    # so the value cannot drift between the project and the artifact, and a release can override
    # MARKETING_VERSION from the tag instead of anyone editing a plist by hand.
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "4"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  # Shared 3MF parsing, also consumed by the Quick Look project. Previously compiled by
  # relative path from ../Quicklook, which made the two projects positionally coupled.
  ThreeMFKit:
    path: ../ThreeMFKit
targets:
  PrintFileManagerCore:
    # A static library rather than a framework: an embedded framework is a versioned bundle full
    # of symlinks, and the notarization broker's preflight rejects any archive containing one.
    # The app ships as a single binary, so nothing is embedded at all.
    type: library.static
    platform: macOS
    sources:
      - Sources/PrintFileManagerCore
    dependencies:
      - package: ZIPFoundation
      - package: ThreeMFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.PrintFileManagerCore
        GENERATE_INFOPLIST_FILE: "YES"
        # A dependency of the app, not a shipped product. Without this, archiving tries to
        # install its headers, which the script sandbox denies.
        SKIP_INSTALL: "YES"
        # Pure Swift, so there is no Objective-C interface worth generating. Emitting one adds a
        # copy-header script phase that the script sandbox denies while archiving.
        SWIFT_INSTALL_OBJC_HEADER: "NO"

  PrintFileManager:
    type: application
    platform: macOS
    sources:
      - Sources/PrintFileManagerApp
    dependencies:
      - target: PrintFileManagerCore
      # A static library does not carry its dependencies, so the app links the package too.
      - package: ThreeMFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.PrintFileManager
        INFOPLIST_FILE: Sources/PrintFileManagerApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PrintFileManagerApp/PrintFileManager.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PrintFileManagerCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PrintFileManagerCoreTests
    dependencies:
      - target: PrintFileManagerCore
      - package: ZIPFoundation
      - package: ThreeMFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.PrintFileManagerCoreTests
        GENERATE_INFOPLIST_FILE: "YES"

  PrintFileManagerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PrintFileManagerAppTests
    dependencies:
      - target: PrintFileManager
      - target: PrintFileManagerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.printfilemanager.PrintFileManagerAppTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrintFileManager.app/Contents/MacOS/PrintFileManager"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PrintFileManager:
    build:
      targets:
        PrintFileManager: all
        PrintFileManagerCoreTests: [test]
        PrintFileManagerAppTests: [test]
    test:
      targets:
        - PrintFileManagerCoreTests
        - PrintFileManagerAppTests